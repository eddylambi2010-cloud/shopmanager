<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SHOPMANAGER - Votre commerce, simplement.</title>
  
  <!-- PWA Metadata & App Icon -->
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ShopManager" />
  <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22SHOPMANAGER%22%2C%22short_name%22%3A%22ShopManager%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23F8FAFC%22%2C%22theme_color%22%3A%22%230F172A%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3081%2F3081559.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D" />
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com%2F512%2F3081%2F3081559.png" />

  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0F172A',
              blue: '#2563EB',
              yellow: '#F59E0B',
              green: '#10B981',
              red: '#EF4444',
              bg: '#F8FAFC'
            }
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & ReactDOM Development/Production UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Design Mobile-First & Accessibilité Tactile */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .btn-large {
      min-height: 3.5rem;
      font-size: 1.125rem;
    }
    .pulse-red {
      animation: pulse-red 1.5s infinite;
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
  </style>
</head>
<body class="h-full bg-slate-100 text-slate-900 font-sans antialiased selection:bg-blue-500 selection:text-white">

  <div id="root" class="h-full"></div>

  <!-- Script d'Architecture & Application React -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- BASE DE DONNÉES LOCALE (SIMULATION SUPABASE & PERSISTANCE) ---
    const INITIAL_DB = {
      user: {
        id: "usr_001",
        name: "Edouard Lambi",
        phone: "+24107000000",
        businessName: "Alimentation Mbolo",
        city: "Libreville",
        role: "admin", // admin ou merchant
        subscription: "PRO", // FREE, PRO, BUSINESS
        subExpiresAt: new Date(Date.now() + 25 * 24 * 60 * 60 * 1000).toISOString()
      },
      sections: [
        { id: "sec_1", name: "Alimentation" },
        { id: "sec_2", name: "Boissons" },
        { id: "sec_3", name: "Beauté & Hygiène" }
      ],
      products: [
        { id: "p1", sectionId: "sec_1", name: "Riz 5 kg", buyPrice: 6500, sellPrice: 8000, stock: 20, minStock: 3, image: "🍚" },
        { id: "p2", sectionId: "sec_1", name: "Huile 1L", buyPrice: 1200, sellPrice: 1500, stock: 12, minStock: 5, image: "🍾" },
        { id: "p3", sectionId: "sec_2", name: "Jus d'Orange", buyPrice: 700, sellPrice: 1000, stock: 2, minStock: 5, image: "🧃" },
        { id: "p4", sectionId: "sec_3", name: "Savon de Toilette", buyPrice: 300, sellPrice: 500, stock: 30, minStock: 10, image: "🧼" }
      ],
      customers: [
        { id: "c1", name: "Jean Koumba", phone: "+24106554433", debt: 25000, history: [] },
        { id: "c2", name: "Marie Obame", phone: "+24107112233", debt: 0, history: [] }
      ],
      sales: [
        { id: "s1", total: 16000, profit: 3000, itemsCount: 2, date: new Date().toISOString(), isCredit: false }
      ],
      expenses: [
        { id: "e1", title: "Transport marchandise", amount: 5000, date: new Date().toISOString(), type: "OUT" }
      ],
      notifications: [
        { id: "n1", title: "Stock Faible", message: "Le produit Jus d'Orange a atteint son stock minimum !", active: true }
      ],
      adminConfig: {
        proPrice: 10000,
        businessPrice: 25000,
        gracePeriodDays: 2,
        mobileNumbers: { airtel: "+24107001122", moov: "+24106001122" }
      }
    };

    function getDB() {
      const saved = localStorage.getItem("SHOPMANAGER_DB");
      return saved ? JSON.parse(saved) : INITIAL_DB;
    }

    function saveDB(data) {
      localStorage.setItem("SHOPMANAGER_DB", JSON.stringify(data));
    }

    // --- APPLICATION PRINCIPALE ---
    function App() {
      const [db, setDb] = useState(getDB());
      const [screen, setScreen] = useState("HOME"); // HOME, SELL, PRODUCTS, MONEY, CUSTOMERS, RESULTS, ADMIN, VOICE
      const [cart, setCart] = useState([]);
      const [selectedSection, setSelectedSection] = useState("ALL");
      const [voiceListening, setVoiceListening] = useState(false);
      const [voiceText, setVoiceText] = useState("");
      const [bannerDismissed, setBannerDismissed] = useState(false);

      useEffect(() => {
        saveDB(db);
        if (window.lucide) window.lucide.createIcons();
      }, [db, screen, cart]);

      // Synthèse vocale de confirmation
      const speak = (text) => {
        if ('speechSynthesis' in window) {
          const uttr = new SpeechSynthesisUtterance(text);
          uttr.lang = 'fr-FR';
          window.speechSynthesis.speak(uttr);
        }
      };

      // Partage PWA / Web Share API
      const handleShare = () => {
        if (navigator.share) {
          navigator.share({
            title: 'SHOPMANAGER',
            text: 'Gérez votre commerce simplement avec SHOPMANAGER !',
            url: window.location.href,
          }).catch(() => {});
        } else {
          alert("Lien de l'application copié dans le presse-papier : " + window.location.href);
        }
      };

      // Reconnaissance Vocale
      const startVoiceRecognition = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("La reconnaissance vocale n'est pas supportée par votre navigateur. Essayez Chrome Android.");
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.continuous = false;

        setVoiceListening(true);
        setVoiceText("Écoute en cours... Parlez maintenant.");

        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript.toLowerCase();
          setVoiceText(`" ${transcript} "`);
          setVoiceListening(false);
          processVoiceCommand(transcript);
        };

        recognition.onerror = () => {
          setVoiceText("Erreur lors de l'écoute. Réessayez.");
          setVoiceListening(false);
        };

        recognition.start();
      };

      // Traitement des commandes vocales
      const processVoiceCommand = (cmd) => {
        if (cmd.includes("riz")) {
          const riz = db.products.find(p => p.name.toLowerCase().includes("riz"));
          if (riz) {
            addToCart(riz);
            speak("Deux sacs de riz ajoutés au panier. Voulez-vous encaisser ?");
            setScreen("SELL");
          }
        } else if (cmd.includes("combien") || cmd.includes("vendu")) {
          const totalVentes = db.sales.reduce((acc, s) => acc + s.total, 0);
          speak(`Vous avez vendu pour ${totalVentes.toLocaleString()} Francs CFA aujourd'hui.`);
          setScreen("RESULTS");
        } else if (cmd.includes("qui") || cmd.includes("doit")) {
          const totalDettes = db.customers.reduce((acc, c) => acc + c.debt, 0);
          speak(`Vos clients vous doivent au total ${totalDettes.toLocaleString()} Francs CFA.`);
          setScreen("CUSTOMERS");
        } else {
          speak("Commande reçue. Vérifiez l'écran d'accueil.");
        }
      };

      // Fonctions Vente
      const addToCart = (product) => {
        if (product.stock <= 0) {
          alert("Stock épuisé !");
          return;
        }
        const existing = cart.find(item => item.id === product.id);
        if (existing) {
          if (existing.qty + 1 > product.stock) {
            alert("Quantité maximale disponible atteinte.");
            return;
          }
          setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
        } else {
          setCart([...cart, { ...product, qty: 1 }]);
        }
      };

      const removeFromCart = (id) => {
        setCart(cart.filter(item => item.id !== id));
      };

      const checkout = (isCredit = false, customerId = null) => {
        if (cart.length === 0) return;

        const total = cart.reduce((sum, item) => sum + (item.sellPrice * item.qty), 0);
        const cost = cart.reduce((sum, item) => sum + (item.buyPrice * item.qty), 0);
        const profit = total - cost;

        // Mise à jour Stocks
        const updatedProducts = db.products.map(p => {
          const inCart = cart.find(c => c.id === p.id);
          if (inCart) {
            return { ...p, stock: p.stock - inCart.qty };
          }
          return p;
        });

        // Enregistrement Vente
        const newSale = {
          id: "s_" + Date.now(),
          total,
          profit,
          itemsCount: cart.reduce((sum, item) => sum + item.qty, 0),
          date: new Date().toISOString(),
          isCredit,
          customerId
        };

        // Gestion Crédit Client
        let updatedCustomers = [...db.customers];
        if (isCredit && customerId) {
          updatedCustomers = updatedCustomers.map(c => {
            if (c.id === customerId) {
              return { ...c, debt: c.debt + total };
            }
            return c;
          });
        }

        const newDb = {
          ...db,
          products: updatedProducts,
          sales: [newSale, ...db.sales],
          customers: updatedCustomers
        };

        setDb(newDb);
        setCart([]);
        speak("Vente réussie !");
        alert(`VENTE RÉUSSIE ✅\nMontant : ${total.toLocaleString()} FCFA`);
      };

      // Ajout de Produit
      const handleAddProduct = (e) => {
        e.preventDefault();
        const form = e.target;
        const name = form.pName.value;
        const sellPrice = Number(form.pSell.value);
        const buyPrice = Number(form.pBuy.value);
        const stock = Number(form.pStock.value);
        const sectionId = form.pSection.value;

        const newP = {
          id: "p_" + Date.now(),
          sectionId,
          name,
          sellPrice,
          buyPrice,
          stock,
          minStock: 3,
          image: "📦"
        };

        setDb({ ...db, products: [...db.products, newP] });
        form.reset();
        alert("Produit ajouté avec succès !");
      };

      // Ajout de Section
      const handleAddSection = () => {
        const name = prompt("Nom de la nouvelle section (Ex: Boissons, Beauté, Divers) :");
        if (name) {
          const newSec = { id: "sec_" + Date.now(), name };
          setDb({ ...db, sections: [...db.sections, newSec] });
        }
      };

      // Vérification alerte stock
      const lowStockAlerts = db.products.filter(p => p.stock <= p.minStock);

      return (
        <div className="flex flex-col h-full max-w-md mx-auto bg-slate-50 shadow-2xl overflow-hidden relative border-x border-slate-200">
          
          <!-- EN-TÊTE FIXE DU COMMERÇANT -->
          <header className="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md">
            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setScreen("HOME")}>
              <div className="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-slate-900 font-extrabold text-xl shadow-inner">
                🏪
              </div>
              <div>
                <h1 className="font-black text-lg tracking-wide leading-tight">SHOPMANAGER</h1>
                <p className="text-xs text-amber-400 font-medium">{db.user.businessName}</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              {/* Bouton Admin Privé */}
              {db.user.role === 'admin' && (
                <button 
                  onClick={() => setScreen("ADMIN")} 
                  className="bg-slate-800 hover:bg-slate-700 text-amber-400 p-2 rounded-xl text-xs font-bold border border-amber-500/30 flex items-center gap-1"
                >
                  <i data-lucide="shield-check" className="w-4 h-4"></i> Admin
                </button>
              )}

              {/* Bouton Partager (Flèche haut) */}
              <button 
                onClick={handleShare} 
                className="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-xl transition shadow-sm"
                title="Partager l'application"
              >
                <i data-lucide="upload" className="w-5 h-5"></i>
              </button>
            </div>
          </header>

          <!-- BOUTON RETOUR ET TITRE ECRAN SECOND DOMAINE -->
          {screen !== "HOME" && (
            <div className="bg-slate-200 px-4 py-2 flex items-center justify-between border-b border-slate-300">
              <button 
                onClick={() => setScreen("HOME")} 
                className="flex items-center text-slate-800 font-bold bg-white px-3 py-1.5 rounded-lg text-sm shadow-sm hover:bg-slate-100"
              >
                <i data-lucide="arrow-left" className="w-4 h-4 mr-1"></i> RETOUR
              </button>
              <span className="font-extrabold text-slate-700 text-xs tracking-wider uppercase">
                {screen}
              </span>
            </div>
          )}

          <!-- NOTIFICATION FLOTANTE STOCK FAIBLE (ROUGE CLIGNOTANT) -->
          {lowStockAlerts.length > 0 && !bannerDismissed && (
            <div className="bg-red-600 text-white p-3 pulse-red flex items-center justify-between shadow-lg">
              <div className="flex items-center space-x-2 text-sm font-bold">
                <i data-lucide="alert-triangle" className="w-5 h-5"></i>
                <span>⚠️ {lowStockAlerts.length} produit(s) en stock faible !</span>
              </div>
              <button 
                onClick={() => setBannerDismissed(true)} 
                className="bg-white text-red-600 text-xs font-bold px-2 py-1 rounded shadow"
              >
                OK / Masquer
              </button>
            </div>
          )}

          <!-- CORPS DE L'APPLICATION (ROUTAGE) -->
          <main className="flex-1 overflow-y-auto p-4 space-y-4">
            
            {/* 1. ÉCRAN ACCUEIL */}
            {screen === "HOME" && (
              <div className="space-y-5">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl font-black text-slate-800">Bonjour 👋</h2>
                    <p className="text-sm text-slate-500 font-medium">Que voulez-vous faire ?</p>
                  </div>
                  <span className="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1.5 rounded-full border border-emerald-200">
                    Abonnement PRO ✅
                  </span>
                </div>

                {/* 4 GRANDES FONCTIONS */}
                <div className="grid grid-cols-2 gap-4">
                  <button 
                    onClick={() => setScreen("SELL")}
                    className="bg-blue-600 hover:bg-blue-700 active:scale-95 transition text-white p-5 rounded-3xl shadow-lg flex flex-col items-center justify-center space-y-2 border-b-4 border-blue-800"
                  >
                    <span className="text-4xl">🛒</span>
                    <span className="font-black text-lg tracking-wide">VENDRE</span>
                  </button>

                  <button 
                    onClick={() => setScreen("PRODUCTS")}
                    className="bg-amber-500 hover:bg-amber-600 active:scale-95 transition text-slate-900 p-5 rounded-3xl shadow-lg flex flex-col items-center justify-center space-y-2 border-b-4 border-amber-700"
                  >
                    <span className="text-4xl">📦</span>
                    <span className="font-black text-lg tracking-wide">PRODUITS</span>
                  </button>

                  <button 
                    onClick={() => setScreen("MONEY")}
                    className="bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white p-5 rounded-3xl shadow-lg flex flex-col items-center justify-center space-y-2 border-b-4 border-emerald-800"
                  >
                    <span className="text-4xl">💰</span>
                    <span className="font-black text-lg tracking-wide">ARGENT</span>
                  </button>

                  <button 
                    onClick={() => setScreen("CUSTOMERS")}
                    className="bg-purple-600 hover:bg-purple-700 active:scale-95 transition text-white p-5 rounded-3xl shadow-lg flex flex-col items-center justify-center space-y-2 border-b-4 border-purple-800"
                  >
                    <span className="text-4xl">👤</span>
                    <span className="font-black text-lg tracking-wide">CLIENTS</span>
                  </button>
                </div>

                {/* ASSISTANT VOCAL */}
                <div className="bg-gradient-to-r from-slate-900 to-slate-800 text-white p-5 rounded-3xl shadow-xl flex flex-col items-center text-center space-y-3">
                  <span className="text-xs font-bold tracking-widest text-amber-400 uppercase">Assistant Intelligent</span>
                  <button 
                    onClick={startVoiceRecognition}
                    className={`p-4 rounded-full text-3xl shadow-2xl transition transform active:scale-90 ${voiceListening ? 'bg-red-500 animate-bounce' : 'bg-amber-500 text-slate-900'}`}
                  >
                    🎤
                  </button>
                  <span className="font-black text-base">PARLER À SHOPMANAGER</span>
                  <p className="text-xs text-slate-300 max-w-xs">{voiceText || 'Appuyez et dites : "J\'ai vendu deux sacs de riz"'}</p>
                </div>

                {/* MES RÉSULTATS */}
                <button 
                  onClick={() => setScreen("RESULTS")}
                  className="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 p-4 rounded-2xl font-bold flex items-center justify-between shadow-sm"
                >
                  <div className="flex items-center space-x-3">
                    <span className="text-2xl">📊</span>
                    <span className="font-extrabold text-base">MES RÉSULTATS SIMPLIFIÉS</span>
                  </div>
                  <i data-lucide="chevron-right" className="w-5 h-5"></i>
                </button>
              </div>
            )}

            {/* 2. MODULE VENTE */}
            {screen === "SELL" && (
              <div className="space-y-4">
                {/* SECTIONS / CATÉGORIES */}
                <div className="flex items-center space-x-2 overflow-x-auto pb-2">
                  <button 
                    onClick={() => setSelectedSection("ALL")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap shadow-sm ${selectedSection === "ALL" ? 'bg-blue-600 text-white' : 'bg-white text-slate-700'}`}
                  >
                    Toutes
                  </button>
                  {db.sections.map(sec => (
                    <button 
                      key={sec.id}
                      onClick={() => setSelectedSection(sec.id)}
                      className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap shadow-sm ${selectedSection === sec.id ? 'bg-blue-600 text-white' : 'bg-white text-slate-700'}`}
                    >
                      {sec.name}
                    </button>
                  ))}
                  <button 
                    onClick={handleAddSection}
                    className="px-3 py-2 bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-sm flex items-center gap-1"
                  >
                    + Section
                  </button>
                </div>

                {/* LISTE DES PRODUITS EN CARTES */}
                <div className="grid grid-cols-2 gap-3">
                  {db.products
                    .filter(p => selectedSection === "ALL" || p.sectionId === selectedSection)
                    .map(p => (
                      <div 
                        key={p.id} 
                        onClick={() => addToCart(p)}
                        className="bg-white p-3 rounded-2xl border-2 border-slate-100 shadow-sm active:border-blue-500 flex flex-col items-center text-center space-y-1 cursor-pointer relative"
                      >
                        <span className="text-3xl">{p.image}</span>
                        <span className="font-bold text-slate-800 text-sm">{p.name}</span>
                        <span className="font-black text-blue-600 text-base">{p.sellPrice.toLocaleString()} F</span>
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${p.stock <= p.minStock ? 'bg-red-100 text-red-600' : 'bg-slate-100 text-slate-600'}`}>
                          {p.stock} dispo
                        </span>
                      </div>
                    ))}
                </div>

                {/* PANIER TEMPS RÉEL */}
                {cart.length > 0 && (
                  <div className="bg-slate-900 text-white p-4 rounded-2xl shadow-2xl space-y-3 sticky bottom-0">
                    <h3 className="font-extrabold text-amber-400 text-sm border-b border-slate-700 pb-2">PANIER EN COURS</h3>
                    <div className="max-h-32 overflow-y-auto space-y-2">
                      {cart.map(item => (
                        <div key={item.id} className="flex justify-between items-center text-xs">
                          <span>{item.name} (x{item.qty})</span>
                          <div className="flex items-center space-x-2">
                            <span className="font-bold text-amber-400">{(item.sellPrice * item.qty).toLocaleString()} F</span>
                            <button onClick={() => removeFromCart(item.id)} className="text-red-400 font-bold px-1">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="pt-2 border-t border-slate-700 flex justify-between items-center font-black text-lg">
                      <span>TOTAL :</span>
                      <span className="text-amber-400">
                        {cart.reduce((s, i) => s + (i.sellPrice * i.qty), 0).toLocaleString()} FCFA
                      </span>
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <button 
                        onClick={() => checkout(false)}
                        className="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-black py-3 rounded-xl text-base shadow-lg flex items-center justify-center"
                      >
                        💵 ENCAISSER
                      </button>
                      <button 
                        onClick={() => {
                          const cId = prompt("Sélectionnez ID client (Ex: c1) ou annulez :");
                          if (cId) checkout(true, cId);
                        }}
                        className="w-full bg-red-500 hover:bg-red-600 text-white font-black py-3 rounded-xl text-xs shadow-lg flex items-center justify-center"
                      >
                        🔴 À CRÉDIT
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* 3. MODULE PRODUITS */}
            {screen === "PRODUCTS" && (
              <div className="space-y-4">
                {/* FORMULAIRE AJOUT PRODUIT */}
                <form onSubmit={handleAddProduct} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <h3 className="font-black text-slate-800 text-sm">Ajouter un nouveau produit</h3>
                  <div className="grid grid-cols-2 gap-2">
                    <input name="pName" placeholder="Nom produit" required className="p-2 border border-slate-300 rounded-xl text-sm" />
                    <select name="pSection" className="p-2 border border-slate-300 rounded-xl text-sm">
                      {db.sections.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <input name="pSell" type="number" placeholder="Prix Vente (FCFA)" required className="p-2 border border-slate-300 rounded-xl text-sm" />
                    <input name="pBuy" type="number" placeholder="Prix Achat (FCFA)" required className="p-2 border border-slate-300 rounded-xl text-sm" />
                    <input name="pStock" type="number" placeholder="Quantité Stock" required className="p-2 border border-slate-300 rounded-xl text-sm col-span-2" />
                  </div>
                  <button type="submit" className="w-full bg-amber-500 text-slate-900 font-black py-2.5 rounded-xl text-sm shadow">
                    + AJOUTER LE PRODUIT
                  </button>
                </form>

                {/* LISTE PRODUITS */}
                <div className="space-y-2">
                  <h3 className="font-extrabold text-slate-700 text-xs uppercase">Inventaire actuel</h3>
                  {db.products.map(p => (
                    <div key={p.id} className="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center shadow-sm">
                      <div className="flex items-center space-x-3">
                        <span className="text-2xl">{p.image}</span>
                        <div>
                          <div className="font-bold text-slate-800 text-sm">{p.name}</div>
                          <div className="text-xs text-slate-500">Vente: {p.sellPrice.toLocaleString()} F | Stock: {p.stock}</div>
                        </div>
                      </div>
                      {p.stock <= p.minStock && (
                        <span className="bg-red-100 text-red-600 text-[10px] font-black px-2 py-1 rounded-full">
                          FAIBLE
                        </span>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 4. MODULE ARGENT / CAISSE */}
            {screen === "MONEY" && (
              <div className="space-y-4">
                <div className="bg-slate-900 text-white p-5 rounded-3xl shadow-xl text-center space-y-1">
                  <span className="text-xs font-bold text-slate-400 uppercase">Argent Disponible</span>
                  <div className="text-3xl font-black text-amber-400">
                    {db.sales.reduce((acc, s) => acc + s.total, 0).toLocaleString()} FCFA
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-center">
                    <span className="text-xs font-bold text-emerald-700">Entrées (Ventes)</span>
                    <div className="text-lg font-black text-emerald-800">
                      +{db.sales.reduce((acc, s) => acc + s.total, 0).toLocaleString()} F
                    </div>
                  </div>
                  <div className="bg-red-50 border border-red-200 p-4 rounded-2xl text-center">
                    <span className="text-xs font-bold text-red-700">Sorties (Dépenses)</span>
                    <div className="text-lg font-black text-red-800">
                      -{db.expenses.reduce((acc, e) => acc + e.amount, 0).toLocaleString()} F
                    </div>
                  </div>
                </div>

                {/* ENREGISTRER DÉPENSE */}
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                  <h3 className="font-black text-slate-800 text-sm">Enregistrer une Dépense / Sortie</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const title = e.target.title.value;
                    const amount = Number(e.target.amount.value);
                    setDb({...db, expenses: [{id: "e_"+Date.now(), title, amount, date: new Date().toISOString()}, ...db.expenses]});
                    e.target.reset();
                    alert("Dépense enregistrée !");
                  }} className="space-y-2">
                    <input name="title" placeholder="Motif (Ex: Transport, Loyer)" required className="w-full p-2 border border-slate-300 rounded-xl text-sm" />
                    <input name="amount" type="number" placeholder="Montant FCFA" required className="w-full p-2 border border-slate-300 rounded-xl text-sm" />
                    <button type="submit" className="w-full bg-red-600 text-white font-bold py-2.5 rounded-xl text-sm">
                      ENREGISTRER SORTIE
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* 5. MODULE CLIENTS & DETTES */}
            {screen === "CUSTOMERS" && (
              <div className="space-y-4">
                <div className="bg-purple-900 text-white p-4 rounded-2xl shadow flex justify-between items-center">
                  <div>
                    <span className="text-xs text-purple-300 uppercase font-bold">Total Dettes Client</span>
                    <div className="text-2xl font-black text-amber-400">
                      {db.customers.reduce((acc, c) => acc + c.debt, 0).toLocaleString()} FCFA
                    </div>
                  </div>
                </div>

                <div className="space-y-3">
                  {db.customers.map(c => (
                    <div key={c.id} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                      <div className="flex justify-between items-start">
                        <div>
                          <h4 className="font-black text-slate-800 text-base">{c.name}</h4>
                          <p className="text-xs text-slate-500">{c.phone}</p>
                        </div>
                        <span className={`text-sm font-black px-3 py-1 rounded-full ${c.debt > 0 ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-600'}`}>
                          {c.debt > 0 ? `Doit: ${c.debt.toLocaleString()} F` : 'À jour ✅'}
                        </span>
                      </div>

                      {c.debt > 0 && (
                        <div className="flex space-x-2 pt-2 border-t border-slate-100">
                          <button 
                            onClick={() => {
                              const payed = prompt(`Montant remboursé par ${c.name} :`);
                              if (payed) {
                                const newCustomers = db.customers.map(cust => cust.id === c.id ? {...cust, debt: Math.max(0, cust.debt - Number(payed))} : cust);
                                setDb({...db, customers: newCustomers});
                                alert("Paiement enregistré !");
                              }
                            }}
                            className="flex-1 bg-emerald-500 text-slate-900 font-bold py-2 rounded-xl text-xs"
                          >
                            💰 IL A PAYÉ
                          </button>
                          <a 
                            href={`https://wa.me/${c.phone}?text=Bonjour%20${c.name},%20rappell%20de%20votre%20dette%20chez%20${db.user.businessName}:%20${c.debt}%20FCFA.`}
                            target="_blank"
                            className="bg-emerald-600 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center justify-center"
                          >
                            WhatsApp
                          </a>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 6. RAPPORTS SIMPLIFIÉS */}
            {screen === "RESULTS" && (
              <div className="space-y-4">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                  <h3 className="font-black text-slate-800 text-lg border-b border-slate-100 pb-2">Rapport Simple</h3>
                  
                  <div className="space-y-3">
                    <div className="flex justify-between items-center">
                      <span className="text-sm font-bold text-slate-600">💰 J'ai vendu :</span>
                      <span className="font-black text-slate-900 text-base">
                        {db.sales.reduce((a, s) => a + s.total, 0).toLocaleString()} FCFA
                      </span>
                    </div>

                    <div className="flex justify-between items-center">
                      <span className="text-sm font-bold text-slate-600">📈 Marge / Gain Estimé :</span>
                      <span className="font-black text-emerald-600 text-base">
                        {db.sales.reduce((a, s) => a + s.profit, 0).toLocaleString()} FCFA
                      </span>
                    </div>

                    <div className="flex justify-between items-center">
                      <span className="text-sm font-bold text-slate-600">📦 Ventes Effectuées :</span>
                      <span className="font-black text-slate-900 text-base">{db.sales.length}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* 7. ESPACE ADMINISTRATEUR PRIVÉ */}
            {screen === "ADMIN" && (
              <div className="space-y-4">
                <div className="bg-slate-900 text-white p-4 rounded-2xl shadow space-y-1">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-bold text-amber-400 uppercase">TABLEAU DE BORD SAAS ADMIN</span>
                    <span className="bg-red-500 text-white text-[10px] font-black px-2 py-0.5 rounded">SÉCURISÉ</span>
                  </div>
                  <h3 className="text-xl font-black">Statistiques Réseau</h3>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-white p-3 rounded-xl border border-slate-200">
                    <span className="text-[10px] font-bold text-slate-500">UTILISATEURS</span>
                    <div className="text-xl font-black text-slate-800">142</div>
                  </div>
                  <div className="bg-white p-3 rounded-xl border border-slate-200">
                    <span className="text-[10px] font-bold text-slate-500">REVENUS ABONNEMENT</span>
                    <div className="text-xl font-black text-emerald-600">1 420 000 F</div>
                  </div>
                </div>

                {/* PARAMÈTRES RECONFIGURABLES SANS CODE */}
                <div className="bg-white p-4 rounded-2xl border border-slate-200 space-y-3">
                  <h4 className="font-black text-slate-800 text-sm">Configuration Tarifs & API</h4>
                  <div className="space-y-2">
                    <div>
                      <label className="text-xs font-bold text-slate-600">Prix Abonnement PRO (FCFA)</label>
                      <input 
                        type="number" 
                        defaultValue={db.adminConfig.proPrice}
                        onChange={(e) => setDb({...db, adminConfig: {...db.adminConfig, proPrice: Number(e.target.value)}})}
                        className="w-full p-2 border border-slate-300 rounded-xl text-sm" 
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">Numéro Mobile Money Réception</label>
                      <input 
                        defaultValue={db.adminConfig.mobileNumbers.airtel}
                        onChange={(e) => setDb({...db, adminConfig: {...db.adminConfig, mobileNumbers: {...db.adminConfig.mobileNumbers, airtel: e.target.value}}})}
                        className="w-full p-2 border border-slate-300 rounded-xl text-sm" 
                      />
                    </div>
                  </div>
                  <button onClick={() => alert("Paramètres mis à jour dans la base de données !")} className="w-full bg-slate-900 text-amber-400 font-bold py-2 rounded-xl text-xs">
                    SAUVEGARDER CONFIGURATION
                  </button>
                </div>
              </div>
            )}

          </main>

          <!-- BARRE DE NAVIGATION INFÉRIEURE MOBILE -->
          <nav className="bg-white border-t border-slate-200 grid grid-cols-4 p-2 text-center text-[10px] font-extrabold text-slate-600">
            <button onClick={() => setScreen("HOME")} className={`p-1 flex flex-col items-center ${screen === 'HOME' ? 'text-blue-600' : ''}`}>
              <span className="text-xl">🏠</span>
              <span>Accueil</span>
            </button>
            <button onClick={() => setScreen("SELL")} className={`p-1 flex flex-col items-center ${screen === 'SELL' ? 'text-blue-600' : ''}`}>
              <span className="text-xl">🛒</span>
              <span>Vendre</span>
            </button>

            <button onClick={() => setScreen("MONEY")} className={`p-1 flex flex-col items-center ${screen === 'MONEY' ? 'text-blue-600' : ''}`}>
              <span className="text-xl">💰</span>
              <span>Caisse</span>
            </button>

            <button onClick={() => setScreen("PRODUCTS")} className={`p-1 flex flex-col items-center ${screen === 'PRODUCTS' ? 'text-blue-600' : ''}`}>
              <span className="text-xl">📦</span>
              <span>Stock</span>
            </button>
          </nav>

        </div>
      );
    }

    // Initialisation React
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
