<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SHOPMANAGER</title><meta name="theme-color" content="#0B2A5B">
<style>
:root{--b:#0B2A5B;--a:#1E6BFF;--y:#FFC21A;--g:#16A34A;--r:#DC2626;--bg:#F1F3F6;--c:#fff;--t:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1420;--c:#1a2434;--t:#f2f5fa}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--t);font:18px system-ui,Arial,sans-serif}
*{box-sizing:border-box}header{display:flex;align-items:center;gap:8px;background:var(--b);color:#fff;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{flex:1;text-align:center;font-size:20px}header button{background:#ffffff22;color:#fff;border:0;border-radius:14px;width:52px;height:52px;font-size:26px}
main{max-width:560px;margin:auto;padding:14px 14px 90px}button{font:inherit;cursor:pointer}
.big{display:block;width:100%;min-height:62px;border:0;border-radius:18px;background:var(--a);color:#fff;font-size:20px;font-weight:700;margin:10px 0;padding:10px}
.y{background:var(--y);color:#111}.g{background:var(--g)}.r{background:var(--r)}.lnk{background:none;border:0;color:var(--a);padding:12px;font-size:17px;width:100%}
.hi{font-size:26px;font-weight:700;margin:6px 0}.hi small{display:block;font-size:16px;font-weight:400;opacity:.7}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g4 button{background:var(--c);color:var(--t);border:0;border-radius:22px;padding:22px 6px;font-weight:800;font-size:19px;box-shadow:0 2px 8px #0002}.g4 i{display:block;font-size:54px;font-style:normal;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--c);border-radius:20px;padding:12px;text-align:center;position:relative;box-shadow:0 2px 6px #0002}.card i{display:block;font-size:44px;font-style:normal}.card b,.card span,.card small{display:block}.card span{color:var(--a);font-weight:700}.card small{opacity:.7}
.card em{position:absolute;top:6px;right:8px;background:var(--g);color:#fff;border-radius:50%;min-width:30px;height:30px;line-height:30px;font-style:normal;font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.tabs button{border:0;border-radius:20px;padding:12px 18px;background:var(--c);color:var(--t);white-space:nowrap;font-weight:700}.tabs .on{background:var(--b);color:#fff}
.row{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:16px;padding:12px;margin:8px 0}.row>div{flex:1}.row small{display:block;opacity:.7}.row i{font-size:34px;font-style:normal}
.alert{background:var(--r);color:#fff;border-radius:16px;padding:14px;margin:10px 0;font-weight:700;animation:bl 1s infinite}.alert button{display:block;margin-top:8px;border:0;border-radius:12px;padding:10px;background:#fff;color:var(--r);font-weight:700}
@keyframes bl{50%{opacity:.45}}
.cartp{position:sticky;bottom:0;background:var(--c);border-radius:20px 20px 0 0;padding:12px;box-shadow:0 -4px 14px #0003;margin-top:12px}
.cartp .l{display:flex;align-items:center;gap:6px;margin:4px 0}.cartp .l span{flex:1}.cartp .l button{width:44px;height:44px;border-radius:12px;border:0;background:var(--bg);color:var(--t);font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two button{min-height:56px;border-radius:14px;border:3px solid transparent;font-weight:700;font-size:18px;background:var(--bg);color:var(--t)}.two .on.p{background:var(--g);color:#fff}.two .on.c{background:var(--r);color:#fff}
select,input{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid #8884;background:var(--bg);color:var(--t);margin:4px 0}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}.md{background:var(--c);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px;max-height:90%;overflow:auto}
.num{font-size:38px;font-weight:800}.cd{background:var(--c);border-radius:20px;padding:16px;margin:10px 0;text-align:center}.gr{color:var(--g)}.rd{color:var(--r)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}.bars div{flex:1;background:var(--a);border-radius:6px 6px 0 0;min-height:3px}.bars+.bars{height:auto;font-size:12px;text-align:center;margin-top:2px}.bars+.bars div{background:none}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:12px;font:16px monospace}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),f=n=>Math.round(n).toLocaleString('fr-FR')+' FCFA';
const DAY=864e5,today=()=>new Date().setHours(0,0,0,0);
let S;try{S=JSON.parse(localStorage.getItem('sm'))}catch(e){}
if(!S)S={biz:{name:'Ma boutique',tel:''},settings:{price:5000,days:30,demo:20},secs:[{id:1,name:'Alimentation'},{id:2,name:'Boissons'},{id:3,name:'Beauté'}],
prods:[{id:1,sec:1,name:'Riz 5 kg',icon:'🍚',price:8000,cost:6500,stock:20,min:5},{id:2,sec:2,name:'Jus',icon:'🧃',price:500,cost:300,stock:40,min:10},{id:3,sec:3,name:'Savon',icon:'🧼',price:600,cost:400,stock:3,min:5}],
custs:[{id:1,name:'Jean (démo)',tel:'',debt:0}],sales:[],cash:[],until:0,seen:0,mute:{}};
const save=()=>{try{localStorage.setItem('sm',JSON.stringify(S))}catch(e){}},nid=a=>Math.max(0,...a.map(x=>x.id))+1;
let st=[['home']],cart={},mode='paid',cu=0,sec=0,q='',last=null,pend=null,per=1,vt='';
const go=(s,p)=>{st.push([s,p||{}]);R()},back=()=>{if(st.length>1){st.pop();R()}},home=()=>{st=[['home']];R()};
function share(){const d={title:'SHOPMANAGER',text:'SHOPMANAGER — Votre commerce, simplement.',url:location.href};navigator.share?navigator.share(d).catch(()=>{}):(navigator.clipboard&&navigator.clipboard.writeText(location.href),say('Lien copié ✅'))}
function say(t){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class=md><h3>${t}</h3><button class="big">OK</button></div>`;d.onclick=()=>d.remove();document.body.appendChild(d)}
function form(t,fs,ok,del){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class=md><h3>${t}</h3>${fs.map(x=>`<label>${x.l}${x.o?`<select id=f_${x.k}>${x.o.map(o=>`<option value="${o[0]}" ${o[0]==x.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input id=f_${x.k} type="${x.t||'text'}" ${x.t=='number'?'inputmode=numeric':''} value="${esc(x.v??'')}">`}</label>`).join('')}<button class="big g" id=fok>✅ OK</button>${del?'<button class="big r" id=fdel>🗑️ Supprimer</button>':''}<button class=lnk id=fno>Annuler</button></div>`;document.body.appendChild(d);
$('#fno').onclick=()=>d.remove();if(del)$('#fdel').onclick=()=>{if(confirm('Supprimer ?')){d.remove();del()}};
$('#fok').onclick=()=>{const r={};fs.forEach(x=>{const v=$('#f_'+x.k).value;r[x.k]=x.t=='number'?(+v||0):(x.o?+v:v.trim())});d.remove();ok(r);save();R()}}
const nw={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10},nm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function spk(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0),act=()=>S.until>Date.now();
const since=d=>S.sales.filter(s=>s.d>=d);
function recTxt(s){return `SHOPMANAGER\nReçu de vente\n${S.biz.name}${S.biz.tel?'\nTél : '+S.biz.tel:''}\n${new Date(s.d).toLocaleString('fr-FR')}\n\n${s.items.map(i=>`${i.q} x ${i.name} = ${f(i.q*i.price)}`).join('\n')}\n\nTOTAL : ${f(s.total)}\n${s.paid?'PAYÉ ✅':'À CRÉDIT'}\nMerci !`}
function wa(tel,t){open('https://wa.me/'+String(tel||'').replace(/\D/g,'')+'?text='+encodeURIComponent(t),'_blank')}
const ctot=()=>sum(Object.keys(cart),k=>cart[k]*S.prods.find(p=>p.id==k).price);
const add=id=>{const p=S.prods.find(x=>x.id==id);if((cart[id]||0)<p.stock)cart[id]=(cart[id]||0)+1;else say('Stock épuisé');R()},
chg=(id,d)=>{cart[id]+=d;if(cart[id]<=0)delete cart[id];R()};
function sell(){const ks=Object.keys(cart);if(!ks.length)return;
if(!act()&&S.sales.length>=S.settings.demo){return go('sub')}
if(mode=='credit'&&!cu)return say('Choisissez le client 👤');
const items=ks.map(k=>{const p=S.prods.find(x=>x.id==k);p.stock-=cart[k];return{id:p.id,name:p.name,q:cart[k],price:p.price,cost:p.cost}});
const total=sum(items,i=>i.q*i.price),s={id:nid(S.sales),d:Date.now(),items,total,cost:sum(items,i=>i.q*i.cost),paid:mode=='paid',cu:mode=='credit'?cu:0};
S.sales.push(s);if(s.paid)S.cash.push({d:s.d,type:'in',label:'Vente',amt:total});else S.custs.find(c=>c.id==cu).debt+=total;
last=s;cart={};cu=0;mode='paid';save();st.pop();go('done')}
function ent(type,label){form(label,[{k:'a',l:'Montant (FCFA)',t:'number'}],r=>{if(r.a>0)S.cash.push({d:Date.now(),type,label,amt:r.a})})}
function run(t){const x=nm(t).replace(/(\d)\s+(?=\d{3})/g,'$1');let m;const pr=S.prods.find(p=>nm(p.name).split(' ').some(w=>w.length>2&&x.includes(w.replace(/s$/,''))));
const qn=()=>{const d=x.match(/\d+/);if(d)return+d[0];for(const w of x.split(/\s+/))if(nw[w])return nw[w];return 1};
if(/combien.*(vendu|gagne)/.test(x)){const v=sum(since(today()),s=>s.total);return rep(`Aujourd'hui vous avez vendu ${f(v)}.`)}
if(/qui.*doi/.test(x)){const d=S.custs.filter(c=>c.debt>0);return rep(d.length?d.map(c=>`${c.name} vous doit ${f(c.debt)}`).join('. '):'Personne ne vous doit rien.')}
if(/reste/.test(x)&&pr)return rep(`Il vous reste ${pr.stock} ${pr.name}.`);
if(/d[e]?pense/.test(x)&&(m=x.match(/(\d+)/)))return ask(`Enregistrer une dépense de ${f(+m[1])} ?`,()=>S.cash.push({d:Date.now(),type:'out',label:'Dépense',amt:+m[1]}));
if(/ajoute/.test(x)&&pr){const n=qn();return ask(`Ajouter ${n} ${pr.name} au stock ?`,()=>pr.stock+=n)}
if(/(vendu|vends|vente)/.test(x)&&pr){const n=qn();if(n>pr.stock)return rep(`Il ne reste que ${pr.stock} ${pr.name}.`);
return ask(`Confirmer la vente de ${f(n*pr.price)} ?`,()=>{S.sales.push({id:nid(S.sales),d:Date.now(),items:[{id:pr.id,name:pr.name,q:n,price:pr.price,cost:pr.cost}],total:n*pr.price,cost:n*pr.cost,paid:true,cu:0});pr.stock-=n;S.cash.push({d:Date.now(),type:'in',label:'Vente',amt:n*pr.price})})}
rep("Je n'ai pas compris. Essayez : « J'ai vendu deux riz ».")}
function rep(t){vt=t;spk(t);pend=null;R()}function ask(t,fn){vt=t;pend=fn;spk(t);R()}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return say('Micro non disponible ici. Écrivez votre phrase en bas ✍️');
const r=new SR();r.lang='fr-FR';r.onresult=e=>run(e.results[0][0].transcript);r.onerror=()=>say('Je n\'ai rien entendu. Réessayez ou écrivez.');r.start();vt='🎤 Je vous écoute…';R()}
const V={
home(){const low=S.prods.filter(p=>p.stock<=p.min&&!S.mute[p.id]),tut=['🛒 Pour vendre, appuyez ici.','📦 Pour voir vos produits, appuyez ici.','💰 Pour voir votre argent, appuyez ici.'];
return['SHOPMANAGER',`<div class=hi>Bonjour 👋<small>${esc(S.biz.name)} — Votre commerce, simplement.</small></div>
${S.seen<3?`<div class=cd><b>Étape ${S.seen+1}/3</b><p style="font-size:22px">${tut[S.seen]}</p><button class="big" onclick="S.seen++;save();R()">${S.seen<2?'Suivant ➡️':'J\'ai compris ✅'}</button></div>`:''}
${low.map(p=>`<div class=alert>⚠️ STOCK FAIBLE<br>Il vous reste ${p.stock} ${esc(p.name)}<button onclick="S.mute[${p.id}]=1;save();R()">🔕 Ne plus me le rappeler</button></div>`).join('')}
<div class=g4>${[['🛒','VENDRE','sell'],['📦','PRODUITS','prod'],['💰','ARGENT','money'],['👤','CLIENTS','cust']].map(a=>`<button onclick="go('${a[2]}')"><i>${a[0]}</i>${a[1]}</button>`).join('')}</div>
<button class="big y" onclick="go('voice')">🎤 PARLER À SHOPMANAGER</button><button class="big" onclick="go('stats')">📊 MES RÉSULTATS</button>
<button class=lnk onclick="go('sub')">⭐ Abonnement</button><button class=lnk onclick="form('Mon commerce',[{k:'name',l:'Nom du commerce',v:S.biz.name},{k:'tel',l:'Téléphone',v:S.biz.tel,t:'tel'}],r=>S.biz=r)">⚙️ Mon commerce</button>`]},
sell(){const ps=S.prods.filter(p=>!sec||p.sec==sec),ks=Object.keys(cart),t=ctot();
return['Vendre',`<div class=tabs><button class="${!sec?'on':''}" onclick="sec=0;R()">Tout</button>${S.secs.map(s=>`<button class="${sec==s.id?'on':''}" onclick="sec=${s.id};R()">${esc(s.name)}</button>`).join('')}</div>
<div class=grid>${ps.map(p=>`<div class=card onclick="add(${p.id})"><i>${p.icon}</i><b>${esc(p.name)}</b><span>${f(p.price)}</span><small>${p.stock} disponibles</small>${cart[p.id]?`<em>${cart[p.id]}</em>`:''}</div>`).join('')||'<p>Aucun produit. Allez dans 📦 PRODUITS.</p>'}</div>
${ks.length?`<div class=cartp>${ks.map(k=>{const p=S.prods.find(x=>x.id==k);return`<div class=l><span>${p.icon} ${esc(p.name)}</span><button onclick="chg(${k},-1)">−</button><b>${cart[k]}</b><button onclick="chg(${k},1)">+</button><button onclick="delete cart[${k}];R()">✕</button></div>`}).join('')}
<div class=two><button class="p ${mode=='paid'?'on':''}" onclick="mode='paid';R()">🟢 PAYÉ</button><button class="c ${mode=='credit'?'on':''}" onclick="mode='credit';R()">🔴 À CRÉDIT</button></div>
${mode=='credit'?`<select onchange="cu=+this.value;R()"><option value=0>👤 Choisir le client…</option>${S.custs.map(c=>`<option value=${c.id} ${cu==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><button class=lnk onclick="form('Nouveau client',[{k:'name',l:'Nom'},{k:'tel',l:'Téléphone',t:'tel'}],r=>{if(r.name){const id=nid(S.custs);S.custs.push({id,name:r.name,tel:r.tel,debt:0});cu=id}})">➕ Nouveau client</button>`:''}
<div class=num style="text-align:center">${f(t)}</div><button class="big g" onclick="sell()">💵 ENCAISSER</button></div>`:''}`]},
done(){const s=last;return['Vente',`<div class=cd><div style="font-size:70px">✅</div><h2 class=gr>VENTE RÉUSSIE</h2><div class=num>${f(s.total)}</div>${s.paid?'':'<p class=rd>Noté sur la dette du client</p>'}</div>
<button class="big y" onclick="say('<pre>'+esc(recTxt(last))+'</pre>')">🧾 Reçu</button>
<button class="big g" onclick="wa(${JSON.stringify((S.custs.find(c=>c.id==s.cu)||{}).tel||'')},recTxt(last))">📲 Envoyer sur WhatsApp</button>
<button class="big" onclick="st.pop();go('sell')">🛒 Nouvelle vente</button><button class="big" onclick="st.pop();go('cust')">👤 Nouveau client</button>`]},
prod(){const ps=S.prods.filter(p=>nm(p.name).includes(nm(q)));return['Produits',`<input placeholder="🔍 Rechercher" value="${esc(q)}" onchange="q=this.value;R()">
<button class="big g" onclick="eP()">➕ AJOUTER UN PRODUIT</button><button class=lnk onclick="form('Nouvelle section',[{k:'name',l:'Nom (ex : Boissons)'}],r=>{if(r.name)S.secs.push({id:nid(S.secs),name:r.name})})">📁 Ajouter une section</button>
${S.secs.map(s=>{const l=ps.filter(p=>p.sec==s.id);return`<h3>📁 ${esc(s.name)} <button class=lnk style="width:auto;padding:4px" onclick="form('Section',[{k:'name',l:'Nom',v:'${esc(s.name).replace(/'/g,"\\'")}'}],r=>{if(r.name)S.secs.find(x=>x.id==${s.id}).name=r.name},S.prods.some(p=>p.sec==${s.id})?0:()=>S.secs=S.secs.filter(x=>x.id!=${s.id}))">✏️</button></h3>`+l.map(p=>`<div class=row onclick="eP(${p.id})"><i>${p.icon}</i><div><b>${esc(p.name)}</b><small>${f(p.price)} · ${p.stock} en stock ${p.stock<=p.min?'⚠️':''}</small></div>›</div>`).join('')}).join('')}`]},
cust(){return['Clients',`<button class="big g" onclick="eC()">➕ NOUVEAU CLIENT</button><div class=cd>Total qu'on vous doit<div class="num rd">${f(sum(S.custs,c=>c.debt))}</div></div>
${S.custs.map(c=>`<div class=row onclick="go('fiche',{id:${c.id}})"><i>👤</i><div><b>${esc(c.name)}</b><small>📞 ${esc(c.tel||'—')}</small></div><b class="${c.debt?'rd':'gr'}">${f(c.debt)}</b></div>`).join('')}`]},
fiche(){const c=S.custs.find(x=>x.id==P.id);if(!c){st.pop();return V.cust()}
return[esc(c.name),`<div class=cd>📞 ${esc(c.tel||'—')}<p>Vous doit :</p><div class="num ${c.debt?'rd':'gr'}">${f(c.debt)}</div></div>
${c.debt>0?`<button class="big g" onclick="form('Il a payé',[{k:'a',l:'Montant (FCFA)',t:'number',v:${c.debt}}],r=>{const a=Math.min(r.a,S.custs.find(x=>x.id==${c.id}).debt);if(a>0){S.custs.find(x=>x.id==${c.id}).debt-=a;S.cash.push({d:Date.now(),type:'in',label:'Paiement client',amt:a})}})">💰 IL A PAYÉ</button>
<button class="big y" onclick="wa('${esc(c.tel)}','Bonjour ${esc(c.name).replace(/'/g,"\\'")}, rappel : vous devez ${f(c.debt)} à ${esc(S.biz.name).replace(/'/g,"\\'")}. Merci !')">📲 Rappel WhatsApp</button>`:''}
<button class="big" onclick="eC(${c.id})">✏️ Modifier</button><h3>🧾 Historique</h3>${S.sales.filter(s=>s.cu==c.id).reverse().map(s=>`<div class=row><div>${new Date(s.d).toLocaleDateString('fr-FR')}<small>${s.items.map(i=>i.q+' '+esc(i.name)).join(', ')}</small></div><b>${f(s.total)}</b></div>`).join('')||'<p>Aucun achat à crédit.</p>'}`]},
money(){const i=sum(S.cash.filter(x=>x.type=='in'),x=>x.amt),o=sum(S.cash.filter(x=>x.type=='out'),x=>x.amt);
return['Argent',`<div class=cd>💰 Argent disponible<div class=num>${f(i-o)}</div></div><div class=two><div class=cd>🟢 Entré<br><b class=gr>${f(i)}</b></div><div class=cd>🔴 Sorti<br><b class=rd>${f(o)}</b></div></div>
<button class="big g" onclick="ent('in','Autre recette')">🟢 Autre recette</button>
<div class=two>${['🛍️ Achat','🚚 Transport','👷 Salaire','🏠 Loyer'].map(l=>`<button style="background:var(--r);color:#fff;min-height:60px;border:0;border-radius:14px;font-weight:700;font-size:17px" onclick="ent('out','${l}')">${l}</button>`).join('')}</div>
<button class="big r" onclick="ent('out','Autre dépense')">🔴 Autre dépense</button>
${S.cash.slice(-20).reverse().map(x=>`<div class=row><div>${esc(x.label)}<small>${new Date(x.d).toLocaleDateString('fr-FR')}</small></div><b class="${x.type=='in'?'gr':'rd'}">${x.type=='in'?'+':'−'}${f(x.amt)}</b></div>`).join('')}`]},
stats(){const d=per==1?today():today()-(per-1)*DAY,ss=since(d),v=sum(ss,s=>s.total),m=sum(ss,s=>s.total-s.cost),dep=sum(S.cash.filter(x=>x.type=='out'&&x.d>=d),x=>x.amt),
days=[...Array(7)].map((_,k)=>{const a=today()-(6-k)*DAY;return{l:new Date(a).toLocaleDateString('fr-FR',{weekday:'short'}),v:sum(S.sales.filter(s=>s.d>=a&&s.d<a+DAY),s=>s.total)}}),mx=Math.max(1,...days.map(x=>x.v));
return['Mes résultats',`<div class=tabs>${[[1,"Aujourd'hui"],[7,'7 jours'],[30,'30 jours']].map(a=>`<button class="${per==a[0]?'on':''}" onclick="per=${a[0]};R()">${a[1]}</button>`).join('')}</div>
<div class=cd>💰 J'ai vendu<div class=num>${f(v)}</div></div><div class=cd>📈 J'ai gagné environ<div class="num gr">${f(m-dep)}</div></div>
